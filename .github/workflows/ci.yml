name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (root)
        run: npm run lint

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Test (root)
        run: npm run test

      - name: Lint (control-plane)
        run: npm run lint:control-plane

      - name: Typecheck (control-plane)
        run: npm run typecheck:control-plane

      - name: Build (control-plane)
        run: npm --prefix control-plane run build

      - name: Audit (prod deps)
        run: npm run audit
